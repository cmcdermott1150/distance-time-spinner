<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distance vs. Time Graphs Spinner Activity</title><style>body{font-family:Arial,sans-serif;background:#fff;color:#111;text-align:center;margin:0;padding:20px}h1{font-size:clamp(20px,3vw,32px);text-transform:uppercase}p{font-size:15px}.wrap{display:flex;justify-content:center;flex-wrap:wrap;gap:40px}.wheel{width:min(42vw,360px);min-width:270px;cursor:pointer;touch-action:manipulation}.unit{max-width:900px;margin:auto}.panel{flex:0 1 400px}h2{font-size:25px}.result{min-height:45px;font-size:20px;font-weight:bold}button{background:#111;color:white;border:0;border-radius:7px;padding:12px 26px;font-size:18px;cursor:pointer}button:focus-visible,.wheel:focus-visible{outline:3px solid #2872bb;outline-offset:4px}.pointer{font-size:32px;line-height:28px;margin-bottom:-2px}svg{overflow:visible} .sliceText{font-family:Arial,sans-serif;font-size:15px;fill:black;pointer-events:none} @media(max-width:650px){.wheel{width:290px}} </style></head><body><main class="unit"><h1>Distance vs. Time Graphs Spinner Activity</h1><p>Spin both wheels to help you complete your distance vs. time graphs.</p><div class="wrap"><section class="panel"><h2>ACTIVITY</h2><div class="pointer" aria-hidden="true">▼</div><svg id="activity" class="wheel" viewBox="0 0 400 400" role="button" tabindex="0" aria-label="Spin activity wheel"></svg><div><button onclick="spin('activity')">Spin Activity</button></div><p id="activity-result" class="result" aria-live="polite">Click to spin!</p></section><section class="panel"><h2>TIME</h2><div class="pointer" aria-hidden="true">▼</div><svg id="time" class="wheel" viewBox="0 0 400 400" role="button" tabindex="0" aria-label="Spin time wheel"></svg><div><button onclick="spin('time')">Spin Time</button></div><p id="time-result" class="result" aria-live="polite">Click to spin!</p></section></div></main><script>
const data={activity:[['Walked','slowly'],['Moved at','an increasing','speed'],['Stood','still'],['Crawled'],['Walked','quickly'],['YOUR','CHOICE'],['Ran as fast','as possible'],['Jogged']],time:[['2','minutes'],['3','minutes'],['2.5','minutes'],['4','minutes'],['YOUR','CHOICE'],['3','minutes'],['2.5','minutes'],['1','minute']]};
const ns='http://www.w3.org/2000/svg',state={activity:{angle:0,busy:false},time:{angle:0,busy:false}};function el(tag,attrs,parent){let e=document.createElementNS(ns,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}function polar(deg,r){let a=(deg-90)*Math.PI/180;return [200+r*Math.cos(a),200+r*Math.sin(a)]}function draw(id){let svg=document.getElementById(id),rot=el('g',{id:id+'-rot'},svg);data[id].forEach((lines,i)=>{let a=i*45,b=(i+1)*45,p=polar(a,186),q=polar(b,186);el('path',{d:`M 200 200 L ${p[0]} ${p[1]} A 186 186 0 0 1 ${q[0]} ${q[1]} Z`,fill:'white',stroke:'black','stroke-width':8,'stroke-linejoin':'round'},rot);let mid=polar(a+22.5,116),t=el('text',{x:mid[0],y:mid[1]-(lines.length-1)*10,'text-anchor':'middle',class:'sliceText'},rot);lines.forEach((line,j)=>{let sp=el('tspan',{x:mid[0],dy:j?21:0},t);sp.textContent=line})});el('circle',{cx:200,cy:200,r:30,fill:'black'},rot);rot.style.transformOrigin='200px 200px';rot.style.transform='rotate(0deg)';svg.addEventListener('click',()=>spin(id));svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();spin(id)}})}function spin(id){let s=state[id];if(s.busy)return;s.busy=true;let index=Math.floor(Math.random()*8);let current=((s.angle%360)+360)%360;let target=((360-(index*45+22.5))%360+360)%360;let delta=((target-current+360)%360)+360*5;s.angle+=delta;let rot=document.getElementById(id+'-rot');rot.style.transition='transform 3.7s cubic-bezier(.12,.75,.16,1)';rot.style.transform=`rotate(${s.angle}deg)`;document.getElementById(id+'-result').textContent='Spinning…';setTimeout(()=>{document.getElementById(id+'-result').textContent=data[id][index].join(' ');s.busy=false},3750)}draw('activity');draw('time');
</script></body></html>
